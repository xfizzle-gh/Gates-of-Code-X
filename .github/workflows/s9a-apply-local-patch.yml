name: Apply S9A Local Patch

on:
  push:
    branches:
      - feat/s9a-deterministic-retreat

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/s9a-deterministic-retreat
          fetch-depth: 0
      - name: Apply tested patch
        shell: bash
        run: |
          cat > /tmp/s9a.patch.gz.b64 <<'PATCH'
          
          PATCH
          base64 -d /tmp/s9a.patch.gz.b64 | gzip -d > /tmp/s9a.patch
          git apply --check /tmp/s9a.patch
          git apply /tmp/s9a.patch
          rm .github/workflows/s9a-apply-local-patch.yml
      - name: Commit tested S9A integration
        shell: bash
        run: |
          git config user.name "xfizzle-gh"
          git config user.email "87280532+xfizzle-gh@users.noreply.github.com"
          git add src/gates_of_codex/campaign.py src/gates_of_codex/operational_retreat.py tests/test_operational_s9a_retreat.py docs/operational-retreat.md .github/workflows/s9a-apply-local-patch.yml
          git commit -m "feat: integrate deterministic S9A battle retreat"
          git push origin HEAD:feat/s9a-deterministic-retreat
