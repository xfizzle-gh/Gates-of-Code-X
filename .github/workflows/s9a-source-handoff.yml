name: S9A Source Handoff

on:
  push:
    branches:
      - feat/s9a-deterministic-retreat
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: s9a-source-handoff
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 1
