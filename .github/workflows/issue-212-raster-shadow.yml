name: Issue 212 raster shadow

on:
  pull_request:
    paths:
      - "godot/scripts/tools/map_raster_shadow_benchmark.gd"
      - "godot/scripts/tools/map_raster_shadow_profiler.gd"
      - "godot/scripts/tools/map_raster_shadow_profiler_audited.gd"
      - "godot/scripts/tools/map_raster_shadow_phase_b_audit.gd"
      - ".github/workflows/issue-212-raster-shadow.yml"
      - "docs/research/noresus-map-performance/raster-shadow-comparison.json"
      - "docs/research/noresus-map-performance/rendering-comparison.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-212-raster-shadow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-theatre-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6 libx11-6
      - name: Install Godot 4.7
        run: |
          set -euo pipefail
          GODOT_VERSION=4.7-stable
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          GODOT_BIN="$(find . -maxdepth 1 -type f -name 'Godot_v*_linux.x86_64' | head -n 1)"
          install -m 755 "$GODOT_BIN" "$HOME/godot"
          "$HOME/godot" --version
      - name: Import Godot project
        working-directory: godot
        run: |
          set -euo pipefail
          "$HOME/godot" --headless --path . --import --quit-after 1
      - name: Measure full-theatre raster shadow
        run: |
          set -euo pipefail
          mkdir -p docs/research/noresus-map-performance
          OUT="$(pwd)/docs/research/noresus-map-performance/raster-shadow-ci.json"
          log="$(mktemp)"
          set +e
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            "$HOME/godot" --path godot --audio-driver Dummy \
            -s res://scripts/tools/map_raster_shadow_benchmark.gd -- \
            --snapshot=res://fixtures/snapshots/earth3_operational.json \
            --fixture=res://fixtures/presentation/e3_operational.json \
            --manifest=res://assets/maps/earth3_europe_mediterranean/map_manifest.json \
            --width=1920 --height=1080 --frames=24 \
            --out="$OUT" 2>&1 | tee "$log"
          code=${PIPESTATUS[0]}
          set -e
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error' "$log"; then
            echo "issue-212 full cache: script error"
            exit 1
          fi
          if ! grep -q 'map_raster_shadow_benchmark: PASS' "$log"; then
            echo "issue-212 full cache: missing PASS"
            exit 1
          fi
          exit "$code"
      - name: Validate full-theatre authority contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("docs/research/noresus-map-performance/raster-shadow-ci.json").read_text(encoding="utf-8"))
          assert data.get("ok") is True, data
          assert data.get("issue") == 212, data
          assert data.get("phase") == "B", data
          authority = data.get("authority", {})
          assert authority.get("province_count") == 3514, authority
          assert authority.get("polygon_authority_retained") is True, authority
          assert authority.get("picking_parity") is True, authority
          assert authority.get("water_policy_retained") is True, authority
          cache = data.get("cache", {})
          assert cache.get("persistent") is False, cache
          assert cache.get("campaign_authority") is False, cache
          print("ISSUE212_FULL_CACHE", json.dumps(data.get("delta", {}), sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: issue-212-raster-shadow-full-cache
          path: docs/research/noresus-map-performance/raster-shadow-ci.json
          if-no-files-found: error

  cache-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6 libx11-6
      - name: Install Godot 4.7
        run: |
          set -euo pipefail
          GODOT_VERSION=4.7-stable
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          GODOT_BIN="$(find . -maxdepth 1 -type f -name 'Godot_v*_linux.x86_64' | head -n 1)"
          install -m 755 "$GODOT_BIN" "$HOME/godot"
          "$HOME/godot" --version
      - name: Import Godot project
        working-directory: godot
        run: |
          set -euo pipefail
          "$HOME/godot" --headless --path . --import --quit-after 1
      - name: Benchmark audited full cache vs 512/1024 tiles
        run: |
          set -euo pipefail
          OUT="$(pwd)/docs/research/noresus-map-performance/raster-shadow-comparison.json"
          SCREENS="$(pwd)/docs/research/noresus-map-performance/raster-shadow-screens"
          mkdir -p "$(dirname "$OUT")" "$SCREENS"
          log="$(mktemp)"
          set +e
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            "$HOME/godot" --path godot --audio-driver Dummy \
            -s res://scripts/tools/map_raster_shadow_profiler_audited.gd -- \
            --snapshot=res://fixtures/snapshots/earth3_operational.json \
            --fixture=res://fixtures/presentation/e3_operational.json \
            --manifest=res://assets/maps/earth3_europe_mediterranean/map_manifest.json \
            --width=1920 --height=1080 --frames=24 \
            --out="$OUT" --screens-dir="$SCREENS" 2>&1 | tee "$log"
          code=${PIPESTATUS[0]}
          set -e
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error' "$log"; then
            echo "issue-212 cache matrix: script error"
            exit 1
          fi
          if ! grep -q 'map_raster_shadow_profiler: PASS' "$log"; then
            echo "issue-212 cache matrix: missing PASS"
            exit 1
          fi
          exit "$code"
      - name: Validate audited cache matrix and parity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("docs/research/noresus-map-performance/raster-shadow-comparison.json").read_text(encoding="utf-8"))
          assert data.get("ok") is True, data
          assert data.get("issue") == 212, data
          assert data.get("phase") == "B-debug-shadow", data
          assert int(data.get("frames_per_sample", 0)) >= 24, data.get("frames_per_sample")
          assert data.get("map", {}).get("province_count") == 3514, data.get("map")
          authority = data.get("authority", {})
          assert authority.get("unchanged") is True, authority
          assert authority.get("polygon_backend_remains_live") is True, authority
          assert authority.get("cache_is_presentation_only") is True, authority
          reference = data.get("reference_parity", {})
          assert reference.get("ok") is True, reference
          assert reference.get("water_not_selectable") is True, reference
          assert reference.get("nonempty_legal_targets") is True, reference
          assert reference.get("selected_strategic_formation_id"), reference
          assert len(reference.get("legal_target_ids", [])) > 0, reference
          owner = data.get("owner_refresh_parity", {})
          assert owner.get("ok") is True, owner
          assert owner.get("exact_owner_color_match") is True, owner
          assert float(owner.get("owner_color_max_channel_error", 1.0)) <= float(owner.get("owner_color_tolerance", 0.0)), owner
          cache = data.get("cache", {})
          assert cache.get("persistent") is False, cache
          assert cache.get("campaign_authority") is False, cache
          assert int(cache.get("bytes_rgba8", 0)) > 0, cache
          control = data.get("control", {})
          max_drift = float(control.get("max_baseline_drift_ratio", 1.0))
          assert control.get("design") == "polygon_before -> cache_mode -> polygon_after", control
          assert 0.0 < max_drift <= 0.15, control
          modes = data.get("modes", {})
          base_scenarios = ["idle_full_theatre", "continuous_pan", "continuous_zoom"]
          for mode in ["full_cache", "tile_512", "tile_1024"]:
              assert mode in modes, mode
              for scenario in base_scenarios:
                  bracket = modes[mode].get("scenarios", {}).get(scenario)
                  assert bracket and bracket.get("ok") is True, (mode, scenario, bracket)
                  drift = bracket.get("baseline_drift", {})
                  assert int(drift.get("draw_calls_p50_abs", 1)) == 0, (mode, scenario, drift)
                  assert int(drift.get("primitives_p50_abs", 1)) == 0, (mode, scenario, drift)
                  assert float(drift.get("frame_ms_p50_ratio", 1.0)) <= max_drift, (mode, scenario, drift)
                  assert float(drift.get("frame_ms_p95_ratio", 1.0)) <= max_drift, (mode, scenario, drift)
                  if mode.startswith("tile_"):
                      visible = bracket.get("cache", {}).get("visible_tiles", {})
                      assert int(visible.get("p50", 0)) > 0, (mode, scenario, visible)
          screens = Path("docs/research/noresus-map-performance/raster-shadow-screens")
          for name in ["polygon.png", "full_cache.png", "tile_512.png", "tile_1024.png"]:
              p = screens / name
              assert p.exists() and p.stat().st_size > 0, p
          print("ISSUE212_CACHE_MATRIX_AUDITED", json.dumps({m: {s: modes[m]["scenarios"][s]["delta"] for s in base_scenarios} for m in modes}, sort_keys=True))
          PY
      - name: Benchmark missing Phase B dynamic scenarios
        run: |
          set -euo pipefail
          OUT="$(pwd)/docs/research/noresus-map-performance/raster-shadow-phase-b-audit.json"
          SCREENS="$(pwd)/docs/research/noresus-map-performance/raster-shadow-audit-screens"
          mkdir -p "$SCREENS"
          log="$(mktemp)"
          set +e
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            "$HOME/godot" --path godot --audio-driver Dummy \
            -s res://scripts/tools/map_raster_shadow_phase_b_audit.gd -- \
            --snapshot=res://fixtures/snapshots/earth3_operational.json \
            --fixture=res://fixtures/presentation/e3_operational.json \
            --manifest=res://assets/maps/earth3_europe_mediterranean/map_manifest.json \
            --width=1920 --height=1080 --frames=24 \
            --out="$OUT" --screens-dir="$SCREENS" 2>&1 | tee "$log"
          code=${PIPESTATUS[0]}
          set -e
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error' "$log"; then
            echo "issue-212 Phase B scenario audit: script error"
            exit 1
          fi
          if ! grep -q 'map_raster_shadow_phase_b_audit: PASS' "$log"; then
            echo "issue-212 Phase B scenario audit: missing PASS"
            exit 1
          fi
          exit "$code"
      - name: Validate Phase B scenario and overlay evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("docs/research/noresus-map-performance/raster-shadow-phase-b-audit.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data.get("ok") is True, data
          assert data.get("issue") == 212, data
          assert int(data.get("frames_per_sample", 0)) >= 24, data.get("frames_per_sample")
          authority = data.get("authority", {})
          assert authority.get("unchanged") is True, authority
          assert authority.get("polygon_backend_remains_live") is True, authority
          reference = data.get("reference_parity", {})
          assert reference.get("ok") is True and reference.get("nonempty_legal_targets") is True, reference
          assert len(reference.get("legal_target_ids", [])) > 0, reference
          control = data.get("control", {})
          max_drift = float(control.get("max_baseline_drift_ratio", 1.0))
          align_tol = float(control.get("alignment_tolerance_px", 0.0))
          assert 0.0 < max_drift <= 0.15, control
          assert align_tol > 0.0, control
          scenarios = data.get("scenarios", {})
          required = ["hover_select", "large_formation_counters", "infrastructure_routes", "pending_battle_contact"]
          for scenario in required:
              row = scenarios.get(scenario)
              assert row and row.get("polygon", {}).get("ok") is True, (scenario, row)
              for mode in ["full_cache", "tile_512", "tile_1024"]:
                  mode_row = row.get("modes", {}).get(mode)
                  assert mode_row, (scenario, mode)
                  bracket = mode_row.get("bracket", {})
                  assert bracket.get("ok") is True, (scenario, mode, bracket)
                  drift = bracket.get("baseline_drift", {})
                  assert int(drift.get("draw_calls_p50_abs", 1)) == 0, (scenario, mode, drift)
                  assert int(drift.get("primitives_p50_abs", 1)) == 0, (scenario, mode, drift)
                  assert float(drift.get("frame_ms_p50_ratio", 1.0)) <= max_drift, (scenario, mode, drift)
                  assert float(drift.get("frame_ms_p95_ratio", 1.0)) <= max_drift, (scenario, mode, drift)
                  alignment = mode_row.get("alignment", {})
                  assert alignment.get("ok") is True, (scenario, mode, alignment)
                  assert int(alignment.get("probe_count", 0)) > 0, (scenario, mode, alignment)
                  assert float(alignment.get("max_error_px", 999.0)) <= align_tol, (scenario, mode, alignment)
          assert scenarios["hover_select"]["polygon"]["surface"].get("legal_target_count", 0) > 0
          assert scenarios["large_formation_counters"]["polygon"]["surface"].get("synthetic_counter_count", 0) >= 12
          assert scenarios["infrastructure_routes"]["polygon"]["surface"].get("route_count", 0) > 0
          assert scenarios["infrastructure_routes"]["polygon"]["surface"].get("site_count", 0) > 0
          assert scenarios["pending_battle_contact"]["polygon"]["surface"].get("battle_count", 0) > 0
          assert scenarios["pending_battle_contact"]["polygon"]["surface"].get("contact_count", 0) > 0
          assert scenarios["pending_battle_contact"]["polygon"]["surface"].get("has_pending_battle") is True
          screens = Path("docs/research/noresus-map-performance/raster-shadow-audit-screens")
          names = data.get("screenshots", [])
          assert len(names) == 16, names
          for name in names:
              p = screens / name
              assert p.exists() and p.stat().st_size > 0, p
          print("ISSUE212_PHASE_B_DYNAMIC_AUDIT", json.dumps({s: {m: scenarios[s]["modes"][m]["bracket"]["delta"] for m in scenarios[s]["modes"]} for s in required}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-212-raster-shadow-audited
          path: |
            docs/research/noresus-map-performance/raster-shadow-comparison.json
            docs/research/noresus-map-performance/raster-shadow-screens/*.png
            docs/research/noresus-map-performance/raster-shadow-phase-b-audit.json
            docs/research/noresus-map-performance/raster-shadow-audit-screens/*.png
          if-no-files-found: error
