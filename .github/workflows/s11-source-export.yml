name: S11 Source Export

on:
  push:
    branches:
      - feat/s11-fog-of-war-authority
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package exact checkout
        shell: bash
        run: tar --exclude=.git -czf ../gates-of-codex-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: s11-source-export
          path: ../gates-of-codex-source.tar.gz
          retention-days: 1
