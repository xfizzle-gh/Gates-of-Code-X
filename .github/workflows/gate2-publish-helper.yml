name: Temporary Gate 2 publisher

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".gate2_publish/**"
      - ".github/workflows/gate2-publish-helper.yml"

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/opengs-gate2-geometry-adapter
          fetch-depth: 0
      - name: Reconstruct staged bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import pathlib
          import zipfile
          root = pathlib.Path('.gate2_publish')
          chunks = sorted(root.glob('[0-9][0-9][0-9].b64'))
          if not chunks:
              raise SystemExit('No staged bundle')
          encoded = ''.join(path.read_text(encoding='ascii') for path in chunks)
          print('chunks', len(chunks), 'base64_bytes', len(encoded))
          archive = pathlib.Path('/tmp/gate2-bundle.zip')
          archive.write_bytes(base64.b64decode(encoded, validate=True))
          print('archive_bytes', archive.stat().st_size)
          with zipfile.ZipFile(archive) as handle:
              bad = handle.testzip()
              if bad is not None:
                  raise SystemExit(f'corrupt member: {bad}')
              print('members', handle.namelist())
              handle.extractall('.')
          PY
      - name: Commit test-first bundle
        shell: bash
        run: |
          set -euo pipefail
          message="$(cat .gate2_publish/commit-message.txt)"
          rm -rf .gate2_publish
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "$message"
          git push origin HEAD:agent/opengs-gate2-geometry-adapter
