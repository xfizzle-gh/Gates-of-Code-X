name: Trigger S9A Tested Patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/s9a-deterministic-retreat'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/s9a-deterministic-retreat
          fetch-depth: 0
      - name: Extract and apply tested patch
        shell: bash
        run: |
          sed -n "/cat > \/tmp\/s9a.patch.gz.b64 <<'PATCH'/,/^[[:space:]]*PATCH$/p" .github/workflows/s9a-apply-local-patch.yml \
            | sed '1d;$d;s/^[[:space:]]*//' > /tmp/s9a.patch.gz.b64
          base64 -d /tmp/s9a.patch.gz.b64 | gzip -d > /tmp/s9a.patch
          git apply --check /tmp/s9a.patch
          git apply /tmp/s9a.patch
          rm .github/workflows/s9a-apply-local-patch.yml
          rm .github/workflows/s9a-trigger-apply.yml
      - name: Commit tested S9A integration
        shell: bash
        run: |
          git config user.name "xfizzle-gh"
          git config user.email "87280532+xfizzle-gh@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate deterministic S9A battle retreat"
          git push origin HEAD:feat/s9a-deterministic-retreat
