name: Gates of CodeX

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Campaign CLI smoke test
        run: gates-of-codex --help
      - name: Live acceptance CLI smoke test
        run: gates-of-codex-live --help
      - name: Windows PowerShell installer smoke test
        if: runner.os == 'Windows' && matrix.python-version == '3.11'
        shell: pwsh
        run: |
          Remove-Item -LiteralPath .venv -Recurse -Force -ErrorAction SilentlyContinue
          .\tools\install_gates_of_codex.ps1 -Python (Get-Command python).Source -NoPythonInstall
          .\.venv\Scripts\gates-of-codex.exe --help
          .\.venv\Scripts\gates-of-codex-live.exe --help

  windows-executable:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install . pyinstaller
      - name: Build campaign application
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name GatesOfCodeX run_gates_of_codex.py
      - name: Build live acceptance console
        run: python -m PyInstaller --noconfirm --clean --onefile --console --name GatesOfCodeXLive run_gates_of_codex_live.py
      - uses: actions/upload-artifact@v4
        with:
          name: GatesOfCodeX-Windows
          path: |
            dist/GatesOfCodeX.exe
            dist/GatesOfCodeXLive.exe
