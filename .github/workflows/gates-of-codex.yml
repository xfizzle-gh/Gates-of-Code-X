name: Gates of CodeX

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-shards-ubuntu-311:
    name: python-shard (ubuntu-latest, 3.11, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [core, earth3-authority-bootstrap, p4-production-launch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Stamp package provenance
        id: provenance
        shell: pwsh
        run: |
          $stamp = & .\tools\stamp_package_provenance.ps1
          "commit=$($stamp.Commit)" >> $env:GITHUB_OUTPUT
      - name: Install
        run: python -m pip install -e ".[earth3]"
      - name: Assert installed provenance
        shell: pwsh
        run: python -c 'import sys; from gates_of_codex.packaging import package_identity; assert package_identity().source_commit == sys.argv[1]' '${{ steps.provenance.outputs.commit }}'
      - name: Verify partition and run shard
        run: python tools/run_python_test_shard.py --verify-partition --shard ${{ matrix.shard }}
      - name: Campaign CLI smoke test
        if: matrix.shard == 'core'
        run: gates-of-codex --help
      - name: Live acceptance CLI smoke test
        if: matrix.shard == 'core'
        run: gates-of-codex-live --help
      - name: Cleanup package provenance
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath src\gates_of_codex\SOURCE_COMMIT -Force -ErrorAction SilentlyContinue

  python-shards-ubuntu-313:
    name: python-shard (ubuntu-latest, 3.13, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [core, earth3-authority-bootstrap, p4-production-launch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Stamp package provenance
        id: provenance
        shell: pwsh
        run: |
          $stamp = & .\tools\stamp_package_provenance.ps1
          "commit=$($stamp.Commit)" >> $env:GITHUB_OUTPUT
      - name: Install
        run: python -m pip install -e ".[earth3]"
      - name: Assert installed provenance
        shell: pwsh
        run: python -c 'import sys; from gates_of_codex.packaging import package_identity; assert package_identity().source_commit == sys.argv[1]' '${{ steps.provenance.outputs.commit }}'
      - name: Verify partition and run shard
        run: python tools/run_python_test_shard.py --verify-partition --shard ${{ matrix.shard }}
      - name: Campaign CLI smoke test
        if: matrix.shard == 'core'
        run: gates-of-codex --help
      - name: Live acceptance CLI smoke test
        if: matrix.shard == 'core'
        run: gates-of-codex-live --help
      - name: Cleanup package provenance
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath src\gates_of_codex\SOURCE_COMMIT -Force -ErrorAction SilentlyContinue

  python-shards-windows-311:
    name: python-shard (windows-latest, 3.11, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [core, earth3-authority-bootstrap, p4-production-launch]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Stamp package provenance
        id: provenance
        shell: pwsh
        run: |
          $stamp = & .\tools\stamp_package_provenance.ps1
          "commit=$($stamp.Commit)" >> $env:GITHUB_OUTPUT
      - name: Install
        run: python -m pip install -e ".[earth3]"
      - name: Assert installed provenance
        shell: pwsh
        run: python -c 'import sys; from gates_of_codex.packaging import package_identity; assert package_identity().source_commit == sys.argv[1]' '${{ steps.provenance.outputs.commit }}'
      - name: Verify partition and run shard
        run: python tools/run_python_test_shard.py --verify-partition --shard ${{ matrix.shard }}
      - name: Campaign CLI smoke test
        if: matrix.shard == 'core'
        run: gates-of-codex --help
      - name: Live acceptance CLI smoke test
        if: matrix.shard == 'core'
        run: gates-of-codex-live --help
      - name: Windows PowerShell installer and Workshop deployment smoke test
        if: matrix.shard == 'core'
        shell: pwsh
        run: |
          Remove-Item -LiteralPath .venv -Recurse -Force -ErrorAction SilentlyContinue
          $deploy = Join-Path $env:RUNNER_TEMP "gates-of-codex-workshop-test"
          Remove-Item -LiteralPath $deploy -Recurse -Force -ErrorAction SilentlyContinue
          .\tools\install_gates_of_codex.ps1 `
            -Python (Get-Command python).Source `
            -NoPythonInstall `
            -WorkshopTestTarget $deploy
          .\.venv\Scripts\gates-of-codex.exe --help
          .\.venv\Scripts\gates-of-codex-live.exe --help
          if (-not (Test-Path -LiteralPath (Join-Path $deploy "mod.info") -PathType Leaf)) {
            throw "Workshop deployment did not copy mod.info"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $deploy "resource") -PathType Container)) {
            throw "Workshop deployment did not copy the resource directory"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $deploy ".goc-deployment-manifest.json") -PathType Leaf)) {
            throw "Workshop deployment did not write its manifest"
          }
      - name: Cleanup package provenance
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath src\gates_of_codex\SOURCE_COMMIT -Force -ErrorAction SilentlyContinue

  python-shards-windows-313:
    name: python-shard (windows-latest, 3.13, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [core, earth3-authority-bootstrap, p4-production-launch]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Stamp package provenance
        id: provenance
        shell: pwsh
        run: |
          $stamp = & .\tools\stamp_package_provenance.ps1
          "commit=$($stamp.Commit)" >> $env:GITHUB_OUTPUT
      - name: Install
        run: python -m pip install -e ".[earth3]"
      - name: Assert installed provenance
        shell: pwsh
        run: python -c 'import sys; from gates_of_codex.packaging import package_identity; assert package_identity().source_commit == sys.argv[1]' '${{ steps.provenance.outputs.commit }}'
      - name: Verify partition and run shard
        run: python tools/run_python_test_shard.py --verify-partition --shard ${{ matrix.shard }}
      - name: Campaign CLI smoke test
        if: matrix.shard == 'core'
        run: gates-of-codex --help
      - name: Live acceptance CLI smoke test
        if: matrix.shard == 'core'
        run: gates-of-codex-live --help
      - name: Cleanup package provenance
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath src\gates_of_codex\SOURCE_COMMIT -Force -ErrorAction SilentlyContinue

  test-ubuntu-311:
    name: test (ubuntu-latest, 3.11)
    if: ${{ always() }}
    needs: python-shards-ubuntu-311
    runs-on: ubuntu-latest
    steps:
      - name: Require every Ubuntu 3.11 shard
        env:
          SHARD_RESULT: ${{ needs.python-shards-ubuntu-311.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "Ubuntu 3.11 Python shards did not all succeed: $SHARD_RESULT"
            exit 1
          fi

  test-ubuntu-313:
    name: test (ubuntu-latest, 3.13)
    if: ${{ always() }}
    needs: python-shards-ubuntu-313
    runs-on: ubuntu-latest
    steps:
      - name: Require every Ubuntu 3.13 shard
        env:
          SHARD_RESULT: ${{ needs.python-shards-ubuntu-313.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "Ubuntu 3.13 Python shards did not all succeed: $SHARD_RESULT"
            exit 1
          fi

  test-windows-311:
    name: test (windows-latest, 3.11)
    if: ${{ always() }}
    needs: python-shards-windows-311
    runs-on: ubuntu-latest
    steps:
      - name: Require every Windows 3.11 shard
        env:
          SHARD_RESULT: ${{ needs.python-shards-windows-311.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "Windows 3.11 Python shards did not all succeed: $SHARD_RESULT"
            exit 1
          fi

  test-windows-313:
    name: test (windows-latest, 3.13)
    if: ${{ always() }}
    needs: python-shards-windows-313
    runs-on: ubuntu-latest
    steps:
      - name: Require every Windows 3.13 shard
        env:
          SHARD_RESULT: ${{ needs.python-shards-windows-313.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "Windows 3.13 Python shards did not all succeed: $SHARD_RESULT"
            exit 1
          fi

  godot-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (xvfb for true GL render captures)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6 libx11-6
      - name: Install Godot 4.7
        run: |
          set -euo pipefail
          GODOT_VERSION=4.7-stable
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          GODOT_BIN="$(find . -maxdepth 1 -type f -name 'Godot_v*_linux.x86_64' | head -n 1)"
          install -m 755 "$GODOT_BIN" "$HOME/godot"
          echo "$HOME" >> "$GITHUB_PATH"
          "$HOME/godot" --version
      - name: Godot project import
        working-directory: godot
        run: |
          set -euo pipefail
          # Import can use headless; draw/capture steps require xvfb + real GL.
          "$HOME/godot" --headless --path . --import --quit-after 1
      - name: Godot BattleLocation GDScript unit test
        working-directory: godot
        run: |
          set -euo pipefail
          "$HOME/godot" --headless --path . --audio-driver Dummy \
            -s res://scripts/tools/battle_location_test.gd
      - name: Godot async command runner GDScript unit test
        working-directory: godot
        run: |
          set -euo pipefail
          "$HOME/godot" --headless --path . --audio-driver Dummy \
            -s res://scripts/tools/command_runner_test.gd
      - name: Godot write-back integration GDScript test
        working-directory: godot
        run: |
          set -euo pipefail
          "$HOME/godot" --headless --path . --audio-driver Dummy \
            -s res://scripts/tools/writeback_integration_test.gd
      - name: S10 operational resolution presenter GDScript test
        working-directory: godot
        run: |
          set -euo pipefail
          "$HOME/godot" --headless --path . --audio-driver Dummy \
            -s res://scripts/tools/operational_resolution_presenter_test.gd
      - name: S10 operational presentation scene GDScript test
        working-directory: godot
        run: |
          set -euo pipefail
          "$HOME/godot" --headless --path . --audio-driver Dummy \
            -s res://scripts/tools/operational_presentation_scene_test.gd
      - name: Runtime-patch completion GDScript test
        working-directory: godot
        run: |
          set -euo pipefail
          "$HOME/godot" --headless --path . --audio-driver Dummy \
            -s res://scripts/tools/runtime_patch_completion_test.gd
      - name: Snapshot field-audit GDScript test
        working-directory: godot
        run: |
          set -euo pipefail
          "$HOME/godot" --headless --path . --audio-driver Dummy \
            -s res://scripts/tools/snapshot_field_audit_test.gd
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Stamp package provenance
        id: provenance
        shell: pwsh
        run: |
          $stamp = & .\tools\stamp_package_provenance.ps1
          "commit=$($stamp.Commit)" >> $env:GITHUB_OUTPUT
      - name: Install Python package for P4 snapshot generation
        run: python -m pip install -e ".[earth3]"
      - name: Assert installed provenance
        shell: pwsh
        run: python -c 'import sys; from gates_of_codex.packaging import package_identity; assert package_identity().source_commit == sys.argv[1]' '${{ steps.provenance.outputs.commit }}'
      - name: P6 production Earth3 golden path (real stack + Godot + handoff/import)
        run: GODOT_BIN="$HOME/godot" python -m unittest tests.test_p6_golden_path -v
      - name: Generate P4 production Earth3 snapshot through the player shell
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "tests")
          from test_p2_earth3_campaign_bootstrap import _resolved_catalog
          from gates_of_codex.player_shell import build_play_parser, run_play

          root = Path(os.environ["RUNNER_TEMP"]) / "p4-production-campaign"
          environ = dict(os.environ)
          environ["GATES_OF_CODEX_HOME"] = str(root / "home")
          args = build_play_parser().parse_args(
              [
                  "--new",
                  "--campaign",
                  str(root / "home" / "campaigns" / "earth3_v1"),
                  "--no-launch",
              ]
          )
          # The runner has no installed Gates of Hell stack, so catalog authority
          # is injected the same way the P2 bootstrap tests inject it. Everything
          # downstream is the real production player-launch path.
          result = run_play(args, environ=environ, resolved_catalog=_resolved_catalog())
          assert result.map_id == "earth3_europe_mediterranean", result.map_id
          snapshot = json.loads(Path(result.snapshot_path).read_text(encoding="utf-8"))
          assert snapshot["control"]["maintenance"]["reset_available"]
          Path("p4-snapshot-path.txt").write_text(result.snapshot_path, encoding="utf-8")
          print("generated", result.snapshot_path)
          PY
      - name: Godot P4 player shell contract test (generated production snapshot)
        working-directory: godot
        run: |
          set -euo pipefail
          "$HOME/godot" --headless --path . --audio-driver Dummy \
            -s res://scripts/tools/player_shell_test.gd -- \
            "--snapshot=$(cat ../p4-snapshot-path.txt)"
      - name: Godot graph-native movement dispatch test (#206)
        working-directory: godot
        run: |
          set -euo pipefail
          log="$(mktemp)"
          set +e
          "$HOME/godot" --headless --path . --audio-driver Dummy \
            -s res://scripts/tools/graph_movement_scene_test.gd 2>&1 | tee "$log"
          code=${PIPESTATUS[0]}
          set -e
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error' "$log"; then
            echo "graph_movement_scene_test: SCRIPT ERROR is a failure"
            exit 1
          fi
          if ! grep -q 'graph_movement_scene_test: PASS' "$log"; then
            echo "graph_movement_scene_test: missing PASS"
            exit 1
          fi
          exit "$code"
      - name: Godot map order-controls test (#218)
        working-directory: godot
        run: |
          set -euo pipefail
          log="$(mktemp)"
          set +e
          "$HOME/godot" --headless --path . --audio-driver Dummy \
            -s res://scripts/tools/map_order_controls_test.gd 2>&1 | tee "$log"
          code=${PIPESTATUS[0]}
          set -e
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error' "$log"; then
            echo "map_order_controls_test: SCRIPT ERROR is a failure"
            exit 1
          fi
          if ! grep -q 'map_order_controls_test: PASS' "$log"; then
            echo "map_order_controls_test: missing PASS"
            exit 1
          fi
          exit "$code"
      - name: Godot movement-test compile-error harness
        run: GODOT_BIN="$HOME/godot" python -m unittest tests.test_godot_script_error_harness -v
      - name: Godot map CI check (draw path + viewport smoke)
        working-directory: godot
        run: |
          set -euo pipefail
          # True CanvasItem draw path needs a display (xvfb), not dummy headless.
          # Fail on CanvasItem/ObjectDB/resource exit leaks (#97).
          log="$(mktemp)"
          set +e
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            "$HOME/godot" --path . --audio-driver Dummy \
            -s res://scripts/tools/map_ci_check.gd 2>&1 | tee "$log"
          code=${PIPESTATUS[0]}
          set -e
          if grep -E 'RID of type "CanvasItem" was leaked|ObjectDB instances were leaked|resources still in use at exit' "$log"; then
            echo "map_ci_check: Godot exit leak detected"
            exit 1
          fi
          exit "$code"
      - name: Godot Earth3 polygon smoke
        working-directory: godot
        run: |
          set -euo pipefail
          "$HOME/godot" --headless --path . --audio-driver Dummy \
            -s res://scripts/tools/earth3_polygon_smoke.gd
      - name: Godot Earth3 operational fixture validate (e3_* only)
        working-directory: godot
        run: |
          set -euo pipefail
          log="$(mktemp)"
          set +e
          "$HOME/godot" --headless --path . --audio-driver Dummy \
            -s res://scripts/tools/earth3_fixture_validate.gd 2>&1 | tee "$log"
          code=${PIPESTATUS[0]}
          set -e
          if grep -E 'SCRIPT ERROR' "$log"; then
            echo "earth3_fixture_validate: SCRIPT ERROR is a failure"
            exit 1
          fi
          if grep -E 'earth3_fixture_validate: FAIL' "$log"; then
            echo "earth3_fixture_validate: validator reported FAIL"
            exit 1
          fi
          if ! grep -q 'earth3_fixture_validate: PASS' "$log"; then
            echo "earth3_fixture_validate: missing PASS"
            exit 1
          fi
          exit "$code"
      - name: Earth3 fixture validate adversarial (#204)
        run: GODOT_BIN="$HOME/godot" python -m unittest tests.test_issue_204_earth3_fixture_validate -v
      - name: Godot Earth3 water policy (non-selectable water)
        working-directory: godot
        run: |
          set -euo pipefail
          "$HOME/godot" --headless --path . --audio-driver Dummy \
            -s res://scripts/tools/earth3_water_policy_test.gd
      - name: Earth3 production authority exact
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          auth = json.loads(Path("config/earth3/production_authority.json").read_text(encoding="utf-8"))
          meta = json.loads(Path("godot/assets/maps/earth3_europe_mediterranean/dataset_meta.json").read_text(encoding="utf-8"))
          assert auth["province_count"] == 3514
          assert auth["land_count"] == 3299
          assert auth["water_count"] == 215
          assert auth["included_ids_sha256"] == "f3931d2e34558e451d02a7c49270b2071a79a628668c49228f5ff607a75315b8"
          assert meta["province_count"] == auth["province_count"]
          assert meta["land_count"] == auth["land_count"]
          assert meta["water_count"] == auth["water_count"]
          assert meta["included_source_ids_sha256"] == auth["included_ids_sha256"]
          assert auth.get("water_policy", {}).get("accepted") is True
          assert auth.get("topology_sanitize", {}).get("land_exclusions_accepted") is True
          print("authority ok", auth["province_count"])
          # Exact multi-file consistency (no >= approximations)
          from hashlib import sha256
          body = Path('godot/assets/maps/earth3_europe_mediterranean/polygon_dataset.json').read_text(encoding='utf-8')
          if body.endswith('\n'):
              body = body[:-1]
          ds = __import__('json').loads(body)
          ds_sha = sha256(body.encode('utf-8')).hexdigest()
          meta = __import__('json').loads(Path('godot/assets/maps/earth3_europe_mediterranean/dataset_meta.json').read_text(encoding='utf-8'))
          man = __import__('json').loads(Path('godot/assets/maps/earth3_europe_mediterranean/map_manifest.json').read_text(encoding='utf-8'))
          tri = __import__('json').loads(Path('godot/assets/maps/earth3_europe_mediterranean/triangulation_audit.json').read_text(encoding='utf-8'))
          assert ds['province_count'] == 3514 and len(ds['provinces']) == 3514
          assert ds['land_count'] == 3299 and ds['water_count'] == 215
          assert ds['included_source_ids_sha256'] == auth['included_ids_sha256'] == 'f3931d2e34558e451d02a7c49270b2071a79a628668c49228f5ff607a75315b8'
          assert meta['dataset_sha256'] == man['polygon_dataset']['sha256'] == auth['dataset_sha256'] == ds_sha
          assert tri['province_count_checked'] == 3514 and tri['failed_count'] == 0 and tri.get('ok') is True
          ids = {p['id'] for p in ds['provinces']}
          assert 'e3_2830' not in ids and 'e3_2888' not in ids
          print('authority consistency ok', ds_sha[:16])
          PY
      - name: Godot map profiler (committed fixture)
        run: |
          set -euo pipefail
          mkdir -p docs/godot-presentation
          "$HOME/godot" --headless --path godot -s res://scripts/tools/map_profiler.gd -- \
            --snapshot=res://fixtures/snapshots/em_theatre_profile.json \
            --out="$(pwd)/docs/godot-presentation/ci_profile.json"
          test -s docs/godot-presentation/ci_profile.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("docs/godot-presentation/ci_profile.json").read_text(encoding="utf-8"))
          assert data.get("ok") is True, data
          assert int(data.get("province_count", 0)) >= 300, data
          print("profiler ok", data.get("map_open_ms"), "ms open")
          PY
      - name: Godot Earth3 polygon profiler
        run: |
          set -euo pipefail
          mkdir -p docs/godot-presentation
          "$HOME/godot" --headless --path godot -s res://scripts/tools/map_profiler.gd -- \
            --snapshot=res://fixtures/snapshots/earth3_theatre.json \
            --manifest=res://assets/maps/earth3_europe_mediterranean/map_manifest.json \
            --out="$(pwd)/docs/godot-presentation/ci_profile_earth3.json"
          test -s docs/godot-presentation/ci_profile_earth3.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("docs/godot-presentation/ci_profile_earth3.json").read_text(encoding="utf-8"))
          assert data.get("ok") is True, data
          assert int(data.get("province_count", 0)) >= 3000, data
          assert data.get("renderer") in ("polygon_mesh", "polygon"), data
          print("earth3 profiler ok", data)
          PY
      - name: Godot Earth3 interactive baseline profiler (#74 PR A)
        run: |
          set -euo pipefail
          mkdir -p docs/godot-presentation
          OUT="$(pwd)/docs/godot-presentation/ci_earth3_interactive_baseline.json"
          # Interactive path needs a display (xvfb). Measurement-only; no renderer rewrite.
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            "$HOME/godot" --path godot --audio-driver Dummy \
            -s res://scripts/tools/map_interactive_profiler.gd -- \
            --snapshot=res://fixtures/snapshots/earth3_operational.json \
            --fixture=res://fixtures/presentation/e3_operational.json \
            --manifest=res://assets/maps/earth3_europe_mediterranean/map_manifest.json \
            --width=1920 --height=1080 --frames=24 \
            --build=ci-ubuntu-xvfb \
            --out="$OUT"
          test -s "$OUT"
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("docs/godot-presentation/ci_earth3_interactive_baseline.json").read_text(encoding="utf-8"))
          assert data.get("ok") is True, data
          assert int(data.get("map", {}).get("province_count", 0)) == 3514, data.get("map")
          scenarios = data.get("scenarios", {})
          required = [
              "idle_full_theatre",
              "continuous_pan",
              "continuous_zoom",
              "province_hover_select",
              "legal_target_rebuild",
              "ownership_recolor",
              "overlay_routes_sites_counters",
              "pending_battle_presentation",
          ]
          for key in required:
              assert key in scenarios, key
              ft = scenarios[key].get("frame_time_ms", {})
              assert float(ft.get("avg", 0)) > 0.0, (key, ft)
          ops = data.get("discrete_ops_ms", {})
          for key in ("ownership_refresh_ms", "hit_test_ms", "legal_target_rebuild_ms"):
              assert key in ops, key
          print("earth3 interactive baseline ok", {k: scenarios[k]["frame_time_ms"]["avg"] for k in required})
          PY
      - name: Godot true runtime viewport screenshots
        run: |
          set -euo pipefail
          OUT="$(pwd)/docs/godot-presentation/screenshots/runtime"
          mkdir -p "$OUT"
          SNAP=res://fixtures/snapshots/em_theatre_profile.json
          shoot() {
            local name="$1"; shift
            xvfb-run -a -s "-screen 0 2560x1440x24" \
              "$HOME/godot" --path godot --audio-driver Dummy \
              -s res://scripts/tools/map_screenshot.gd -- \
              --snapshot="$SNAP" --out="$OUT/$name" "$@"
            test -s "$OUT/$name"
          }
          shoot full_map_1080p.png --width=1920 --height=1080 --fixture=res://fixtures/presentation/empty_map.json
          shoot full_map_1440p.png --width=2560 --height=1440 --fixture=res://fixtures/presentation/empty_map.json
          shoot selected_hovered_1080p.png --width=1920 --height=1080 --select-first --hover-second --fixture=res://fixtures/presentation/stack_and_selection.json
          shoot selected_hovered_1440p.png --width=2560 --height=1440 --select-first --hover-second --fixture=res://fixtures/presentation/stack_and_selection.json
          shoot formation_stack_1080p.png --width=1920 --height=1080 --fixture=res://fixtures/presentation/many_counters.json
          shoot route_line_1080p.png --width=1920 --height=1080 --fixture=res://fixtures/presentation/routes_and_battles.json
          shoot node_edge_battle_1080p.png --width=1920 --height=1080 --fixture=res://fixtures/presentation/routes_and_battles.json
          shoot control_site_1080p.png --width=1920 --height=1080 --fixture=res://fixtures/presentation/control_sites.json
          shoot debug_overlay_1080p.png --width=1920 --height=1080 --fixture=res://fixtures/presentation/control_sites.json --debug --select-first
          # S6 pending-battle location captures (true viewport path)
          shoot s6_node_contact_1080p.png --width=1920 --height=1080 --fixture=res://fixtures/presentation/s6_node_contact.json
          shoot s6_node_simultaneous_1080p.png --width=1920 --height=1080 --fixture=res://fixtures/presentation/s6_node_simultaneous.json
          shoot s6_edge_cross_1080p.png --width=1920 --height=1080 --fixture=res://fixtures/presentation/s6_edge_cross.json
          shoot s6_edge_catchup_1080p.png --width=1920 --height=1080 --fixture=res://fixtures/presentation/s6_edge_catchup.json
          shoot s6_legacy_midpoint_1080p.png --width=1920 --height=1080 --fixture=res://fixtures/presentation/s6_legacy_midpoint.json
          ls -la "$OUT"
          python3 - <<'PY'
          import struct
          from pathlib import Path
          root = Path("docs/godot-presentation/screenshots/runtime")
          files = sorted(root.glob("*.png"))
          assert files, "no runtime screenshots"
          for p in files:
              data = p.read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n", p
              # IHDR width/height
              w, h = struct.unpack(">II", data[16:24])
              assert w >= 1280 and h >= 720, (p, w, h)
              assert p.stat().st_size > 50_000, (p, p.stat().st_size)
              print("ok", p.name, f"{w}x{h}", p.stat().st_size)
          PY
      - name: Godot Earth3 theatre screenshots
        run: |
          set -euo pipefail
