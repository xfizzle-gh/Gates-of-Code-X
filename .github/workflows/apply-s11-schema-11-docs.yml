name: Apply S11 Schema 11 Docs

on:
  push:
    branches:
      - fix/s11-schema-11-design

permissions:
  contents: write

jobs:
  apply-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/s11-schema-11-design
          fetch-depth: 0
      - name: Apply exact reviewed docs patch
        shell: bash
        run: |
          cat <<'PATCH_B64' | base64 -d | gzip -d | git apply -

PATCH_B64
          test "$(sha256sum docs/superpowers/specs/2026-08-08-s11-fog-of-war-detection-design.md | cut -d' ' -f1)" = "d06bf7ad307a5e10fe8f1828e8c263485b152ebbef2648c8fb618b63763bd8a6"
          test "$(sha256sum docs/superpowers/plans/2026-08-08-s11-fog-of-war-detection.md | cut -d' ' -f1)" = "7cbbcd2ec08752f1f3c4691c18b272e27aa5e962442886d8758383d77ad03cdc"
          git diff --check
          rm .github/workflows/apply-s11-schema-11-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/specs/2026-08-08-s11-fog-of-war-detection-design.md docs/superpowers/plans/2026-08-08-s11-fog-of-war-detection.md .github/workflows/apply-s11-schema-11-docs.yml
          git commit -m "docs: allocate S11 campaign schema 11"
          git push origin HEAD:fix/s11-schema-11-design
