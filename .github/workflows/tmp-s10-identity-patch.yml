name: Temporary S10 exact identity patch

on:
  push:
    branches:
      - feat/s10-operational-resolution-presentation
    paths:
      - .github/workflows/tmp-s10-identity-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: feat/s10-operational-resolution-presentation
          fetch-depth: 0

      - name: Verify expected accepted ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7e51471d1bcee8eb2af190c8b2235929f21ab730 HEAD
          changed="$(git diff --name-only 7e51471d1bcee8eb2af190c8b2235929f21ab730..HEAD | sort)"
          expected=$'.github/workflows/tmp-s10-identity-patch.yml\ntools/tmp_s10_identity_patch.py'
          test "$changed" = "$expected"

      - name: Apply exact identity correction
        shell: bash
        run: |
          set -euo pipefail
          python tools/tmp_s10_identity_patch.py
          git diff --check

      - name: Commit correction and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          rm tools/tmp_s10_identity_patch.py
          rm .github/workflows/tmp-s10-identity-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(s10): use exact formation counter identities"
          git push origin HEAD:feat/s10-operational-resolution-presentation
