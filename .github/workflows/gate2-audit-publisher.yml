# Retry after verified chunked payload repair.
name: Gate 2 audit correction publisher

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/gate2-audit-publisher.yml"
      - "tools/opengs_eval/gate2_audit_patch.py"

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - name: Apply guarded correction
        run: python tools/opengs_eval/gate2_audit_patch.py
      - name: Install focused dependencies
        run: python -m pip install numpy==2.3.5 pillow==12.0.0 scipy==1.16.3 shapely==2.1.2
      - name: Compile corrected files
        run: python -m py_compile tools/opengs_eval/gate1_to_gate2_adapter.py tests/test_opengs_gate1_to_gate2_adapter.py
      - name: Run corrected Gate 2 suite
        run: python -m unittest tests.test_opengs_gate1_to_gate2_adapter -v
      - name: Validate patch surface
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          allowed=$'docs/research/opengs-evaluation/gate_2_geometry_adapter.md\ntests/test_opengs_gate1_to_gate2_adapter.py\ntools/opengs_eval/gate1_to_gate2_adapter.py'
          test "$changed" = "docs/research/opengs-evaluation/gate_2_geometry_adapter.md" || test "$changed" = "$allowed"
      - name: Commit and push correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/opengs-evaluation/gate_2_geometry_adapter.md tests/test_opengs_gate1_to_gate2_adapter.py tools/opengs_eval/gate1_to_gate2_adapter.py
          git commit -m "fix: authenticate Gate 2 input semantics"
          git push origin "HEAD:${{ github.head_ref }}"
