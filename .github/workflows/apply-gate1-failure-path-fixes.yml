name: Apply Gate 1 failure-path fixes

on:
  push:
    branches:
      - agent/opengs-gate1-deterministic-headless
    paths:
      - ".gate1-failure-path-fixes.part*"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/opengs-gate1-deterministic-headless
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - name: Reassemble and apply correction set
        shell: bash
        run: |
          set -euo pipefail
          cat .gate1-failure-path-fixes.part00 .gate1-failure-path-fixes.part01 .gate1-failure-path-fixes.part02 .gate1-failure-path-fixes.part03 \
            | base64 --decode > /tmp/apply_gate1_failure_path_fixes.py
          python /tmp/apply_gate1_failure_path_fixes.py
          rm -f .gate1-failure-path-fixes.part00 .gate1-failure-path-fixes.part01 .gate1-failure-path-fixes.part02 .gate1-failure-path-fixes.part03
      - name: Install pinned Gate 1 profile
        run: python -m pip install numpy==2.3.5 pillow==12.0.0 scipy==1.16.3 jsonschema==4.25.1
      - name: Validate correction set
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/opengs_eval/gate1_common.py \
            tools/opengs_eval/gate1_regions.py \
            tools/opengs_eval/gate1_pipeline.py \
            tools/opengs_eval/gate1_generator.py \
            tools/opengs_eval/make_gate1_fixture.py \
            tests/test_opengs_gate1_determinism.py
          python -m unittest tests.test_opengs_gate1_determinism -v
          git diff --check
      - name: Commit and push correction set
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden Gate 1 failure-path verification"
          git push origin HEAD:agent/opengs-gate1-deterministic-headless
