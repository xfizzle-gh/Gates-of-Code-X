name: OpenGS Gate 1 determinism

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/opengs-gate1-determinism.yml"
      - "tools/opengs_eval/gate1_*"
      - "tools/opengs_eval/make_gate1_fixture.py"
      - "tests/test_opengs_gate1_determinism.py"
      - "docs/research/opengs-evaluation/gate_1_implementation.md"

permissions:
  contents: write

jobs:
  apply-corrections:
    if: github.head_ref == 'agent/opengs-gate1-deterministic-headless'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/opengs-gate1-deterministic-headless
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - name: Apply correction set
        shell: bash
        run: |
          set -euo pipefail
          test -f .gate1-spatial-fixes.ready
          python .github/scripts/apply_gate1_spatial_authority.py
          python .github/scripts/apply_gate1_lake_parent_authority.py
      - name: Install pinned Gate 1 profile
        run: python -m pip install numpy==2.3.5 pillow==12.0.0 scipy==1.16.3
      - name: Validate correction set
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/opengs_eval/gate1_common.py \
            tools/opengs_eval/gate1_regions.py \
            tools/opengs_eval/gate1_pipeline.py \
            tools/opengs_eval/gate1_generator.py \
            tools/opengs_eval/make_gate1_fixture.py \
            tests/test_opengs_gate1_determinism.py \
            tests/test_opengs_gate1_spatial_integrity.py
          python -m unittest \
            tests.test_opengs_gate1_determinism \
            tests.test_opengs_gate1_spatial_integrity -v
          git diff --check
      - name: Remove temporary correction machinery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/opengs-gate1-determinism.yml')
          text = path.read_text(encoding='utf-8')
          start = text.index('  apply-corrections:\n')
          end = text.index('  generate:\n', start)
          text = text[:start] + text[end:]
          text = text.replace('permissions:\n  contents: write\n', 'permissions:\n  contents: read\n', 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          rm -f \
            .github/scripts/apply_gate1_spatial_authority.py \
            .github/scripts/apply_gate1_lake_parent_authority.py \
            .github/workflows/apply-gate1-spatial-authority.yml \
            .gate1-spatial-fixes.ready
      - name: Commit and push correction set
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: authenticate Gate 1 spatial authority"
          git push origin HEAD:agent/opengs-gate1-deterministic-headless

  generate:
    name: ${{ matrix.os }} clean deterministic generation
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install numpy==2.3.5 pillow==12.0.0 scipy==1.16.3
      - name: Compile
        run: python -m py_compile tools/opengs_eval/gate1_generator.py tools/opengs_eval/make_gate1_fixture.py
      - name: Unit contracts
        run: python -m unittest tests.test_opengs_gate1_determinism -v
      - name: Create checksummed fixture recipe
        run: python tools/opengs_eval/make_gate1_fixture.py --output build/gate1-inputs
      - name: Validate recipe
        run: python tools/opengs_eval/gate1_generator.py validate-recipe build/gate1-inputs/recipe.json
      - name: Generate clean workspace A
        run: python tools/opengs_eval/gate1_generator.py generate build/gate1-inputs/recipe.json --output build/gate1-run-a
      - name: Generate clean workspace B
        run: python tools/opengs_eval/gate1_generator.py generate build/gate1-inputs/recipe.json --output build/gate1-run-b
      - name: Compare clean workspaces
        run: python tools/opengs_eval/gate1_generator.py compare-runs build/gate1-run-a build/gate1-run-b
      - name: Benchmark repeated output
        run: python tools/opengs_eval/gate1_generator.py benchmark build/gate1-inputs/recipe.json --output build/gate1-benchmark --repetitions 3
      - uses: actions/upload-artifact@v4
        with:
          name: gate1-${{ runner.os }}
          path: build/gate1-run-a/
          if-no-files-found: error

  cross-platform:
    name: Linux and Windows byte parity
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - name: Install pinned dependencies
        run: python -m pip install numpy==2.3.5 pillow==12.0.0 scipy==1.16.3
      - uses: actions/download-artifact@v4
        with:
          pattern: gate1-*
          path: build/downloads
      - name: Compare Linux and Windows outputs
        run: python tools/opengs_eval/gate1_generator.py compare-runs build/downloads/gate1-Linux build/downloads/gate1-Windows
