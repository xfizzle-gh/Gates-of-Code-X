name: Gates of CodeX Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Stamp package provenance
        id: provenance
        shell: pwsh
        run: |
          $stamp = & .\tools\stamp_package_provenance.ps1
          "commit=$($stamp.Commit)" >> $env:GITHUB_OUTPUT
      - name: Install and test
        shell: pwsh
        run: |
          python -m pip install . pyinstaller
          python -c 'import sys; from gates_of_codex.packaging import package_identity; assert package_identity().source_commit == sys.argv[1]' '${{ steps.provenance.outputs.commit }}'
          python -m unittest discover -s tests -v
      - name: Build executables
        shell: pwsh
        run: |
          $authorityData = @(
            "--add-data", "$((Resolve-Path 'config\earth3\production_authority.json').Path);config/earth3",
            "--add-data", "$((Resolve-Path 'config\earth3\p3_operational_authority.json').Path);config/earth3",
            "--add-data", "$((Resolve-Path 'godot\assets\maps\earth3_europe_mediterranean\map_manifest.json').Path);godot/assets/maps/earth3_europe_mediterranean",
            "--add-data", "$((Resolve-Path 'godot\assets\maps\earth3_europe_mediterranean\polygon_dataset.json').Path);godot/assets/maps/earth3_europe_mediterranean",
            "--add-data", "$((Resolve-Path 'godot\assets\maps\earth3_europe_mediterranean\dataset_meta.json').Path);godot/assets/maps/earth3_europe_mediterranean",
            "--add-data", "$((Resolve-Path 'godot\assets\maps\earth3_europe_mediterranean\p3_authority\p3_operational_graph.json').Path);godot/assets/maps/earth3_europe_mediterranean/p3_authority",
            "--add-data", "$((Resolve-Path 'docs\audits\p3-first-corridor-route-inventory.json').Path);docs/audits",
            "--add-data", "$((Resolve-Path 'src\gates_of_codex\data\earth3_v1\sites.json').Path);src/gates_of_codex/data/earth3_v1"
          )
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name GatesOfCodeX @authorityData --add-data "src\gates_of_codex\SOURCE_COMMIT;gates_of_codex" run_gates_of_codex.py
          python -m PyInstaller --noconfirm --clean --onefile --console --name GatesOfCodeXLive @authorityData --add-data "src\gates_of_codex\SOURCE_COMMIT;gates_of_codex" run_gates_of_codex_live.py
      - name: Smoke frozen runtime provenance
        shell: pwsh
        run: |
          $expectedCommit = '${{ steps.provenance.outputs.commit }}'
          $sourceCommit = (Resolve-Path -LiteralPath "src\gates_of_codex\SOURCE_COMMIT").Path
          $probeRoot = Join-Path $env:RUNNER_TEMP ("gates-of-codex-frozen-probe-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $probeRoot | Out-Null
          try {
            $probeScript = Join-Path $probeRoot "provenance_probe.py"
            $probeBody = @'
          import sys

          from gates_of_codex.packaging import package_identity

          expected = sys.argv[1]
          actual = package_identity().source_commit
          if actual != expected:
              raise SystemExit(f"Frozen runtime provenance mismatch: expected {expected}, got {actual}")
          print(actual)
          '@
            [System.IO.File]::WriteAllText($probeScript, $probeBody, [System.Text.UTF8Encoding]::new($false))
            $probeDist = Join-Path $probeRoot "dist"
            $probeWork = Join-Path $probeRoot "build"
            python -m PyInstaller --noconfirm --clean --onefile --console --name GatesOfCodeXProvenanceProbe --distpath $probeDist --workpath $probeWork --specpath $probeRoot --add-data "$sourceCommit;gates_of_codex" $probeScript
            if ($LASTEXITCODE -ne 0) { throw "Unable to build frozen provenance probe." }
            Remove-Item Env:GATES_OF_CODEX_SOURCE_COMMIT -ErrorAction SilentlyContinue
            & (Join-Path $probeDist "GatesOfCodeXProvenanceProbe.exe") $expectedCommit | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Frozen runtime provenance mismatch." }
          }
          finally {
            Remove-Item -LiteralPath $probeRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Smoke frozen provenance and Earth3 authority payload
        shell: pwsh
        run: |
          $expectedCommit = '${{ steps.provenance.outputs.commit }}'
          $requiredAuthorityNames = @(
            "production_authority.json",
            "p3_operational_authority.json",
            "map_manifest.json",
            "polygon_dataset.json",
            "dataset_meta.json",
            "p3_operational_graph.json",
            "p3-first-corridor-route-inventory.json",
            "sites.json"
          )
          foreach ($executable in @("dist\GatesOfCodeX.exe", "dist\GatesOfCodeXLive.exe")) {
            $archive = (pyi-archive_viewer -l $executable | Out-String)
            if ($LASTEXITCODE -ne 0 -or $archive -notmatch 'SOURCE_COMMIT') {
              throw "Frozen executable is missing provenance: $executable"
            }
            foreach ($requiredName in $requiredAuthorityNames) {
              if ($archive -notmatch [regex]::Escape($requiredName)) {
                throw "Frozen executable is missing Earth3 runtime authority $requiredName`: $executable"
              }
            }
            $verified = $false
            foreach ($entry in @("gates_of_codex\SOURCE_COMMIT", "gates_of_codex/SOURCE_COMMIT")) {
              $extracted = (@("X $entry", "", "Q") | pyi-archive_viewer $executable | Out-String)
              if ($LASTEXITCODE -eq 0 -and $extracted -match [regex]::Escape($expectedCommit)) {
                $verified = $true
                break
              }
            }
            if (-not $verified) {
              throw "Frozen executable provenance does not match $expectedCommit`: $executable"
            }
          }
          .\dist\GatesOfCodeXLive.exe --help | Out-Null
          python -c 'import sys; from gates_of_codex.packaging import package_identity; assert package_identity().source_commit == sys.argv[1]' '${{ steps.provenance.outputs.commit }}'
      - name: Cleanup package provenance
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath src\gates_of_codex\SOURCE_COMMIT -Force -ErrorAction SilentlyContinue
      - name: Assemble release directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/GatesOfCodeX | Out-Null
          Copy-Item dist/GatesOfCodeX.exe release/GatesOfCodeX/
          Copy-Item dist/GatesOfCodeXLive.exe release/GatesOfCodeX/
          Copy-Item README.md, LICENSE, mod.info release/GatesOfCodeX/
          Copy-Item -Recurse config release/GatesOfCodeX/config
          Copy-Item -Recurse resource release/GatesOfCodeX/resource
          Copy-Item -Recurse docs release/GatesOfCodeX/docs
          Copy-Item -Recurse godot release/GatesOfCodeX/godot
          Copy-Item -Recurse tools release/GatesOfCodeX/tools
          Compress-Archive -Path release/GatesOfCodeX -DestinationPath release/GatesOfCodeX-Windows.zip -Force
          git archive --format=zip --output=release/GatesOfCodeX-Source.zip HEAD
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem release/*.zip
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GatesOfCodeX-Release
          path: |
            release/GatesOfCodeX-Windows.zip
            release/GatesOfCodeX-Source.zip
            release/SHA256SUMS.txt
