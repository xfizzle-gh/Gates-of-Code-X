name: Apply S9A Review Fixes

on:
  push:
    branches:
      - feat/s9a-deterministic-retreat

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/s9a-deterministic-retreat
          fetch-depth: 0
      - name: Apply validated review-fix patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/s9a-review-fixes.patch
          echo '2b4f6355d511b2305bae3f80ca0e66a0deaef5f779915f700b466dd7a27f2090  /tmp/s9a-review-fixes.patch' | sha256sum -c -
          git apply --check /tmp/s9a-review-fixes.patch
          git apply /tmp/s9a-review-fixes.patch
          rm .github/workflows/s9a-apply-review-fixes.yml
          git diff --check
      - name: Commit review fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/operational-retreat.md src/gates_of_codex/campaign.py src/gates_of_codex/operational_retreat.py tests/test_operational_s9a_retreat.py .github/workflows/s9a-apply-review-fixes.yml
          git commit -m 'fix(operational): address S9A review findings'
          git push origin HEAD:feat/s9a-deterministic-retreat
