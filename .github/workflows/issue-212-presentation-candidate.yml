name: Issue 212 presentation candidate

on:
  pull_request:
    paths:
      - "godot/main.tscn"
      - "godot/scripts/main_presentation_candidate.gd"
      - "godot/scripts/presentation/strategic_raster_candidate.gd"
      - "godot/scripts/tools/map_presentation_candidate_test.gd"
      - ".github/workflows/issue-212-presentation-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-212-presentation-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hybrid-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6 libx11-6
      - name: Install Godot 4.7
        run: |
          set -euo pipefail
          GODOT_VERSION=4.7-stable
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          GODOT_BIN="$(find . -maxdepth 1 -type f -name 'Godot_v*_linux.x86_64' | head -n 1)"
          install -m 755 "$GODOT_BIN" "$HOME/godot"
          "$HOME/godot" --version
      - name: Import Godot project
        working-directory: godot
        run: |
          set -euo pipefail
          "$HOME/godot" --headless --path . --import --quit-after 1
      - name: Prove default-off and opt-in hybrid authority parity
        run: |
          set -euo pipefail
          log="$(mktemp)"
          set +e
          xvfb-run -a -s "-screen 0 1280x720x24" \
            "$HOME/godot" --path godot --audio-driver Dummy \
            -s res://scripts/tools/map_presentation_candidate_test.gd 2>&1 | tee "$log"
          code=${PIPESTATUS[0]}
          set -e
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error' "$log"; then exit 1; fi
          if ! grep -q 'map_presentation_candidate_test: PASS' "$log"; then exit 1; fi
          exit "$code"
