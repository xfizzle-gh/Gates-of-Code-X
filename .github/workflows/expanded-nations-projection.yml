name: Expanded Nations projection

on:
  push:
    branches:
      - feat/170-expanded-nations-activation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase192_apply:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/189-expanded-nations-phase2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Apply exact #192 implementation patch
        run: python tools/apply_phase192.py
      - name: Install
        run: python -m pip install -e .
      - name: Pre-push #191/#192 regression gate
        run: >-
          python -m unittest
          tests.test_191_phase2_western_central
          tests.test_191_native_projection_invariants
          tests.test_191_committed_inf_namespace
          tests.test_192_phase2_balkans_east
          tests.test_faction_wiring
          tests.test_strategic_actors
          tests.test_actor_economy
          -v
      - name: Push implementation commit if branch is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git fetch origin feat/189-expanded-nations-phase2
          test "$(git rev-parse origin/feat/189-expanded-nations-phase2)" = "$(git rev-parse HEAD)"
          git config user.name "xFizzle Phase 2 controller"
          git config user.email "87280532+xfizzle-gh@users.noreply.github.com"
          git add -A
          git commit -m "feat(#192): add Balkans and Eastern European actors"
          git push origin HEAD:feat/189-expanded-nations-phase2

  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      - name: Expanded Nations unit tests
        run: >-
          python -m unittest
          tests.test_expanded_nations
          tests.test_expanded_nations_audit_regressions
          tests.test_expanded_nations_compile_boundary
          tests.test_expanded_nations_cross_side_breeds
          tests.test_expanded_nations_inf_costs
          tests.test_expanded_nations_cost_evidence
          tests.test_expanded_nations_legacy_side_conflicts
          tests.test_expanded_nations_matrix
          tests.test_expanded_nations_native_contracts
          tests.test_expanded_nations_native_failure_paths
          tests.test_expanded_nations_native_squad_ids
          tests.test_faction_audit_adjustments
          tests.test_faction_wrapper_units
          tests.test_191_phase2_western_central
          tests.test_191_native_projection_invariants
          tests.test_191_committed_inf_namespace
          tests.test_192_phase2_balkans_east
          -v
      - name: CLI smoke
        run: python -m gates_of_codex.expanded_nations_cli --help
      - name: Compile changed Python
        run: >-
          python -m py_compile
          src/gates_of_codex/expanded_nations.py
          src/gates_of_codex/expanded_nations_actor_sources.py
          src/gates_of_codex/expanded_nations_breeds.py
          src/gates_of_codex/expanded_nations_cli.py
          src/gates_of_codex/expanded_nations_compile.py
          src/gates_of_codex/expanded_nations_inf_costs.py
          src/gates_of_codex/expanded_nations_matrix.py
          src/gates_of_codex/expanded_nations_models.py
          src/gates_of_codex/expanded_nations_native_verify.py
          src/gates_of_codex/expanded_nations_opponent_render.py
          src/gates_of_codex/expanded_nations_opponents.py
          src/gates_of_codex/expanded_nations_presentation.py
          src/gates_of_codex/expanded_nations_render.py
          src/gates_of_codex/expanded_nations_sources.py
          src/gates_of_codex/expanded_nations_storage.py
          src/gates_of_codex/expanded_nations_transaction.py
          src/gates_of_codex/expanded_nations_verify.py
          tests/test_expanded_nations.py
          tests/test_expanded_nations_audit_regressions.py
          tests/test_expanded_nations_compile_boundary.py
          tests/test_expanded_nations_cross_side_breeds.py
          tests/test_expanded_nations_inf_costs.py
          tests/test_expanded_nations_legacy_side_conflicts.py
          tests/test_expanded_nations_matrix.py
          tests/test_expanded_nations_native_contracts.py
          tests/test_expanded_nations_native_failure_paths.py
          tests/test_expanded_nations_native_squad_ids.py
          tests/test_faction_audit_adjustments.py
          tests/test_faction_wrapper_units.py
          src/gates_of_codex/goc_native_dc_seam.py
          src/gates_of_codex/goc_tactical_army_registry.py
          src/gates_of_codex/strategic_actors.py
          tests/test_191_phase2_western_central.py
          tests/test_191_native_projection_invariants.py
          tests/test_191_committed_inf_namespace.py
          tests/test_192_phase2_balkans_east.py

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows activation wrapper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [scriptblock]::Create((Get-Content -Raw '.\\tools\\activate_expanded_nation.ps1')) | Out-Null
