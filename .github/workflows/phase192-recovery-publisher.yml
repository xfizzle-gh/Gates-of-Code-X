name: Phase 192 recovery publisher

on:
  push:
    branches:
      - feat/189-expanded-nations-phase2
    paths:
      - tools/.phase192_recovery_go

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Reconstruct exact validated patch
        run: python tools/phase192_recovery_publish.py
      - name: Apply clean #192 production tree
        shell: bash
        run: |
          set -euo pipefail
          git apply --exclude=.github/workflows/expanded-nations-projection.yml --whitespace=nowarn tools/.phase192_recovery.patch
          rm -f .github/workflows/phase192-recovery-publisher.yml
          rm -f .github/workflows/phase192-branch-snapshot.yml
          rm -f tools/.phase192_exact_patch.*
          rm -f tools/.phase192_recovery_patch.*
          rm -f tools/.phase192_recovery_go
          rm -f tools/.phase192_recovery.patch
          rm -f tools/.phase192_final_workflow.yml
          rm -f tools/.phase192_patch1 tools/.phase192_patch2 tools/.phase192_patch3 tools/.phase192_patch4 tools/.phase192_patch5 tools/.phase192_patch6
          rm -f tools/apply_phase192.py
          rm -f tools/phase192_recovery_publish.py
          if find . -path './.git' -prune -o \( -name '.phase192*' -o -name 'apply_phase192.py' -o -name 'phase192_recovery_publish.py' -o -name 'phase192-branch-snapshot.yml' -o -name 'phase192-recovery-publisher.yml' \) -print | grep -q .; then
            echo 'temporary #192 transport residue remains' >&2
            exit 1
          fi
      - name: Install
        run: python -m pip install -e .
      - name: Focused #191/#192 regression gate
        run: >-
          python -m unittest
          tests.test_191_phase2_western_central
          tests.test_191_native_projection_invariants
          tests.test_191_committed_inf_namespace
          tests.test_192_phase2_balkans_east
          tests.test_faction_wiring
          tests.test_strategic_actors
          tests.test_actor_economy
          -v
      - name: Verify final tree and publish forward commit
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          test "$(git write-tree)" = "35b6eeb5f03446895d65c1d8a1cd2d7dde1bf0e1"
          git fetch origin feat/189-expanded-nations-phase2
          test "$(git rev-parse origin/feat/189-expanded-nations-phase2)" = "${GITHUB_SHA}"
          git config user.name "xFizzle Phase 2 recovery controller"
          git config user.email "87280532+xfizzle-gh@users.noreply.github.com"
          git commit -m "feat(#192): publish Balkans and Eastern European actors"
          git push origin HEAD:feat/189-expanded-nations-phase2
