name: Issue 212 UX LOD

on:
  pull_request:
    paths:
      - "godot/scripts/presentation/strategic_map_lod_policy.gd"
      - "godot/scripts/presentation/strategic_map_layer_control.gd"
      - "godot/scripts/presentation/strategic_minimap_prototype.gd"
      - "godot/scripts/tools/map_ux_lod_profiler.gd"
      - "godot/scripts/tools/map_ux_lod_profiler_v2.gd"
      - "godot/scripts/tools/map_ux_lod_profiler_stable.gd"
      - ".github/workflows/issue-212-ux-lod.yml"
      - "docs/research/noresus-map-performance/ux-lod-plan.md"
      - "docs/research/noresus-map-performance/ux-lod-evidence.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-212-ux-lod-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ux-lod-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6 libx11-6
      - name: Install Godot 4.7
        run: |
          set -euo pipefail
          GODOT_VERSION=4.7-stable
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          GODOT_BIN="$(find . -maxdepth 1 -type f -name 'Godot_v*_linux.x86_64' | head -n 1)"
          install -m 755 "$GODOT_BIN" "$HOME/godot"
          "$HOME/godot" --version
      - name: Import Godot project
        working-directory: godot
        run: |
          set -euo pipefail
          "$HOME/godot" --headless --path . --import --quit-after 1
      - name: Benchmark UX LOD and minimap
        run: |
          set -euo pipefail
          ROOT="$(pwd)/docs/research/noresus-map-performance"
          OUT="$ROOT/ux-lod-ci.json"
          SCREENS="$ROOT/ux-lod-screens"
          mkdir -p "$SCREENS"
          log="$(mktemp)"
          set +e
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            "$HOME/godot" --path godot --audio-driver Dummy \
            -s res://scripts/tools/map_ux_lod_profiler_stable.gd -- \
            --snapshot=res://fixtures/snapshots/earth3_operational.json \
            --fixture=res://fixtures/presentation/e3_operational.json \
            --manifest=res://assets/maps/earth3_europe_mediterranean/map_manifest.json \
            --width=1920 --height=1080 --frames=24 --out="$OUT" --screens-dir="$SCREENS" 2>&1 | tee "$log"
          code=${PIPESTATUS[0]}
          set -e
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error' "$log"; then exit 1; fi
          if ! grep -q 'map_ux_lod_profiler: PASS' "$log"; then exit 1; fi
          exit "$code"
      - name: Validate Phase D evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("docs/research/noresus-map-performance")
          data = json.loads((root / "ux-lod-ci.json").read_text(encoding="utf-8"))
          assert data.get("ok") is True and data.get("issue") == 212, data
          assert data.get("phase") == "D-debug-ux-lod", data
          assert int(data.get("frames_per_sample", 0)) >= 24, data
          control = data.get("control", {})
          assert control.get("policy_apply_count_per_scene") == 1, control
          assert control.get("policy_has_process_loop") is False, control
          assert control.get("layer_control_has_process_loop") is False, control
          contract = data.get("layer_contract", {})
          required = {
              "formation_symbols", "names", "infrastructure_sites",
              "operational_routes", "supply", "objectives",
              "fog_intelligence", "debug_overlays",
          }
          assert set(contract.get("keys", [])) == required, contract
          assert set(contract.get("contract_only_not_independently_measurable", [])) == {"supply", "objectives", "fog_intelligence"}, contract
          states = contract.get("profiles", {})
          full = states["full_theatre_auto"]
          assert full.get("formation_symbols") is True, full
          assert full.get("names") is False and full.get("infrastructure_sites") is False and full.get("operational_routes") is False, full
          operational = states["operational_auto"]
          assert operational.get("names") is False and operational.get("infrastructure_sites") is True and operational.get("operational_routes") is True, operational
          detailed = states["detailed_auto"]
          assert detailed.get("names") is True and detailed.get("infrastructure_sites") is True and detailed.get("operational_routes") is True, detailed
          disabled = states["all_measurable_disabled"]
          for key in contract.get("measurable_current_surfaces", []):
              assert disabled.get(key) is False, (key, disabled)
          authority = data.get("authority", {})
          assert authority.get("unchanged") is True and authority.get("polygon_backend_remains_live") is True, authority
          for name, row in data.get("profiles", {}).items():
              assert row.get("ok") is True, (name, row)
              drift = row.get("baseline_drift", {})
              assert int(drift.get("draw_calls_p50_abs", 1)) == 0, (name, drift)
              assert int(drift.get("primitives_p50_abs", 1)) == 0, (name, drift)
              assert float(drift.get("frame_ms_p50_ratio", 1.0)) <= 0.15, (name, drift)
              assert float(drift.get("frame_ms_p95_ratio", 1.0)) <= 0.15, (name, drift)
          minimap = data.get("minimap", {})
          assert minimap.get("ok") is True, minimap
          assert minimap.get("second_live_earth3_scene") is False, minimap
          assert minimap.get("process_loop") is False, minimap
          assert minimap.get("selection_overlay") is True, minimap
          assert int(minimap.get("front_contact_overlay_points", 0)) > 0, minimap
          assert int(minimap.get("texture_size", {}).get("width", 0)) == 250, minimap
          for name in ["full_theatre_auto.png", "detailed_auto.png"]:
              p = root / "ux-lod-screens" / name
              assert p.exists() and p.stat().st_size > 0, p
          print("ISSUE212_UX_LOD_VALIDATED", json.dumps({
              "profiles": sorted(data.get("profiles", {})),
              "minimap": minimap.get("texture_size", {}),
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-212-ux-lod
          path: |
            docs/research/noresus-map-performance/ux-lod-ci.json
            docs/research/noresus-map-performance/ux-lod-screens/*.png
          if-no-files-found: error
