name: OpenGS Gate 2 transport diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/opengs-gate2-geometry.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Print transport digests
        shell: bash
        run: |
          set -euo pipefail
          sha256sum .gate2-audit/part00 .gate2-audit/part01 .gate2-audit/part02 .gate2-audit/part03 .gate2-audit/part04 .gate2-audit/part05
