name: OpenGS Gate 2 audit correction publisher

on:
  pull_request:
    paths:
      - ".github/workflows/opengs-gate2-geometry.yml"
      - ".gate2-audit/**"
      - "tools/opengs_eval/gate1_to_gate2_adapter.py"
      - "tests/test_opengs_gate1_to_gate2_adapter.py"
      - "docs/research/opengs-evaluation/gate_2_geometry_adapter.md"

permissions:
  contents: write

jobs:
  publish-correction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
      - name: Reconstruct and verify correction archive
        shell: bash
        run: |
          set -euo pipefail
          cat .gate2-audit/part00 .gate2-audit/part01 .gate2-audit/part02 .gate2-audit/part03 .gate2-audit/part04 .gate2-audit/part05 | base64 --decode > /tmp/gate2-fix.tar.gz
          echo "ca73c7c1d6f747b3e5aa2b4d5fdb06a143a0ff0f68024f734b087780023f4a36  /tmp/gate2-fix.tar.gz" | sha256sum --check --strict
          tar -tzf /tmp/gate2-fix.tar.gz
          tar -xzf /tmp/gate2-fix.tar.gz -C .
      - name: Install pinned Gate 1 and Gate 2 dependencies
        run: python -m pip install numpy==2.3.5 pillow==12.0.0 scipy==1.16.3 shapely==2.1.2
      - name: Compile corrected sources
        run: python -m py_compile tools/opengs_eval/gate1_to_gate2_adapter.py tests/test_opengs_gate1_to_gate2_adapter.py
      - name: Generate strict Gate 1 fixture
        run: |
          python tools/opengs_eval/make_gate1_fixture.py --output build/gate1-inputs
          python tools/opengs_eval/gate1_generator.py generate build/gate1-inputs/recipe.json --output build/gate1-run
      - name: Run corrected Gate 2 suite
        env:
          GATE2_GATE1_OUTPUT: build/gate1-run
          GATE2_TERRAIN: build/gate1-inputs/terrain.ppm
          GATE2_CONFIG: tools/opengs_eval/gate2_example_config.json
        run: python -m unittest tests.test_opengs_gate1_to_gate2_adapter -v
      - name: Commit correction and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/opengs_eval/gate1_to_gate2_adapter.py tests/test_opengs_gate1_to_gate2_adapter.py docs/research/opengs-evaluation/gate_2_geometry_adapter.md
          git rm -r .gate2-audit
          git commit -m "fix: authenticate Gate 2 publication and Gate 1 authority"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
