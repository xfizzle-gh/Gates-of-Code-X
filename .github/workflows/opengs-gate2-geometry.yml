# Gate 2 only: no Gate 3 scale or production integration.
name: OpenGS Gate 2 geometry

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/opengs-gate2-geometry.yml"
      - "tools/opengs_eval/gate1_to_gate2_adapter.py"
      - "tools/opengs_eval/gate2_*"
      - "tests/test_opengs_gate1_to_gate2_adapter.py"
      - "godot/scripts/tools/opengs_gate2_polygon_smoke.gd"
      - "docs/research/opengs-evaluation/gate_2_geometry_adapter.md"

permissions:
  contents: read

jobs:
  convert:
    name: ${{ matrix.os }} deterministic geometry conversion
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GATE2_GATE1_OUTPUT: build/gate1-run
      GATE2_TERRAIN: build/gate1-inputs/terrain.ppm
      GATE2_CONFIG: tools/opengs_eval/gate2_example_config.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install numpy==2.3.5 pillow==12.0.0 scipy==1.16.3 shapely==2.1.2
      - name: Compile Gate 2
        run: python -m py_compile tools/opengs_eval/gate1_to_gate2_adapter.py tests/test_opengs_gate1_to_gate2_adapter.py
      - name: Create Gate 1 fixture
        run: python tools/opengs_eval/make_gate1_fixture.py --output build/gate1-inputs
      - name: Generate inspected Gate 1 input
        run: python tools/opengs_eval/gate1_generator.py generate build/gate1-inputs/recipe.json --output build/gate1-run
      - name: Focused Gate 2 acceptance suite
        run: python -m unittest tests.test_opengs_gate1_to_gate2_adapter -v
      - name: Convert clean workspace A
        run: python tools/opengs_eval/gate1_to_gate2_adapter.py convert build/gate1-run build/gate1-inputs/terrain.ppm tools/opengs_eval/gate2_example_config.json --output build/gate2-a
      - name: Convert clean workspace B
        run: python tools/opengs_eval/gate1_to_gate2_adapter.py convert build/gate1-run build/gate1-inputs/terrain.ppm tools/opengs_eval/gate2_example_config.json --output build/gate2-b
      - name: Inspect and compare clean workspaces
        run: |
          python tools/opengs_eval/gate1_to_gate2_adapter.py inspect-output build/gate2-a
          python tools/opengs_eval/gate1_to_gate2_adapter.py inspect-output build/gate2-b
          python tools/opengs_eval/gate1_to_gate2_adapter.py compare-runs build/gate2-a build/gate2-b
      - uses: actions/upload-artifact@v4
        with:
          name: gate2-${{ runner.os }}
          path: build/gate2-a/
          if-no-files-found: error

  cross-platform:
    name: Linux and Windows Gate 2 byte parity
    needs: convert
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - name: Install pinned dependencies
        run: python -m pip install numpy==2.3.5 pillow==12.0.0 scipy==1.16.3 shapely==2.1.2
      - uses: actions/download-artifact@v4
        with:
          pattern: gate2-*
          path: build/downloads
      - name: Compare Linux and Windows outputs
        run: python tools/opengs_eval/gate1_to_gate2_adapter.py compare-runs build/downloads/gate2-Linux build/downloads/gate2-Windows

  godot-runtime:
    name: Existing PolygonMap loads Gate 2 fixture
    needs: convert
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gate2-Linux
          path: build/gate2-runtime
      - name: Install Godot 4.7
        run: |
          set -euo pipefail
          GODOT_VERSION=4.7-stable
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          GODOT_BIN="$(find . -maxdepth 1 -type f -name 'Godot_v*_linux.x86_64' | head -n 1)"
          install -m 755 "$GODOT_BIN" "$HOME/godot"
      - name: Import Godot project
        run: "$HOME/godot" --headless --path godot --import --quit-after 1
      - name: Open generated fixture through existing PolygonMap
        run: >-
          "$HOME/godot" --headless --path godot --audio-driver Dummy
          -s res://scripts/tools/opengs_gate2_polygon_smoke.gd --
          --manifest="$(pwd)/build/gate2-runtime/map_manifest.json"
