name: Issue 161 Wrapper Engine Preflight

on:
  push:
    branches:
      - audit/161-wrapper-engine-acceptance
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Verify audit-only scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 14d784de63d58ddbf993d71f95d9f31b8a370cb2 HEAD
          changed="$(git diff --name-only 14d784de63d58ddbf993d71f95d9f31b8a370cb2...HEAD)"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(audit/issue161/|\.github/workflows/issue161-wrapper-engine-preflight\.yml$)' || true)"
          test -z "$bad"

      - name: Install audited package
        run: python -m pip install -e .

      - name: Compile and inspect generator
        run: |
          python -m py_compile \
            audit/issue161/prepare_wrapper_engine_test.py \
            audit/issue161/run_wrapper_engine_test.py
          python - <<'PY'
          import sys
          from pathlib import Path

          from gates_of_codex.codex.catalog import CodeXCatalogScanner

          audit_dir = Path('audit/issue161').resolve()
          sys.path.insert(0, str(audit_dir))
          import run_wrapper_engine_test as runner

          wrappers = runner.target.WRAPPERS
          expected = {
              'goc_ildu_rifle(ukr)': ('ukr', 11),
              'goc_ildu_at(ukr)': ('ukr', 6),
              'goc_ildu_javelin(ukr)': ('ukr', 4),
              'goc_ildu_recon(ukr)': ('ukr', 4),
              'goc_ildu_engineer(ukr)': ('ukr', 6),
              'goc_ildu_manpads(ukr)': ('ukr', 4),
              'goc_sparta_rifle(rusa)': ('rusa', 11),
              'goc_sparta_recon(rusa)': ('rusa', 5),
              'goc_vostok_rifle(rusa)': ('rusa', 11),
              'goc_vostok_mortar(rusa)': ('rusa', 2),
              'goc_vostok_spg9(rusa)': ('rusa', 2),
              'goc_serb_rifle(rusa)': ('rusa', 10),
              'goc_serb_at(rusa)': ('rusa', 6),
              'goc_serb_recon(rusa)': ('rusa', 5),
          }
          assert runner.target.AUDITED_COMMIT == '14d784de63d58ddbf993d71f95d9f31b8a370cb2'
          assert wrappers == expected
          assert sum(1 for side, _ in wrappers.values() if side == 'ukr') == 6
          assert sum(1 for side, _ in wrappers.values() if side == 'rusa') == 8
          assert sum(count for side, count in wrappers.values() if side == 'ukr') == 35
          assert sum(count for side, count in wrappers.values() if side == 'rusa') == 52

          state = runner.load_migrated_scenario()
          assert state.schema_version >= 6
          assert state.strategic_formations
          assert any(force.faction.value == 'ukr' for force in state.strategic_formations.values())
          assert any(force.faction.value == 'rusa' for force in state.strategic_formations.values())
          assert all(battalion.strategic_formation_id for battalion in state.battalions.values())
          runner.target._select_force(state, runner.target.Faction.UKRAINE)
          runner.target._select_force(state, runner.target.Faction.RUSSIA)

          catalog = CodeXCatalogScanner().scan_stack([Path.cwd()])
          for unit_name, (side, members) in wrappers.items():
              definition = catalog.units.get(unit_name)
              assert definition is not None, unit_name
              assert definition.side == side, (unit_name, definition.side, side)
              assert definition.materializable, unit_name
              assert sum(definition.members.values()) == members, (
                  unit_name,
                  definition.members,
                  members,
              )
          PY

  windows-powershell-preflight:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [scriptblock]::Create((Get-Content -Raw '.\audit\issue161\prepare-wrapper-test.ps1')) | Out-Null
          [scriptblock]::Create((Get-Content -Raw '.\audit\issue161\collect-wrapper-evidence.ps1')) | Out-Null
          python -m py_compile `
            .\audit\issue161\prepare_wrapper_engine_test.py `
            .\audit\issue161\run_wrapper_engine_test.py
