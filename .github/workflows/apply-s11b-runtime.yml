name: Apply S11B Runtime Patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-runtime:
    if: github.head_ref == 'feat/s11-schema11-observation-authority'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/s11-schema11-observation-authority
          fetch-depth: 0
      - name: Apply exact locally tested patch
        shell: bash
        run: |
          cat .github/s11b-patch/part* | base64 -d | gzip -d | git apply -
          rm -rf .github/s11b-patch .github/workflows/apply-s11b-runtime.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add schema 11 S11 observation authority'
          git push origin HEAD:feat/s11-schema11-observation-authority
