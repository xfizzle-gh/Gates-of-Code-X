[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gates-of-codex"
version = "0.4.0"
description = "A clean-room strategic campaign bridge for Call to Arms: Gates of Hell and Code:X"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "xfizzle-gh"}]
dependencies = []

[project.scripts]
gates-of-codex = "gates_of_codex.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gates_of_codex = ["py.typed", "data/*"]
