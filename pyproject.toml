[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gates-of-codex"
version = "0.16.0"
description = "A clean-room strategic campaign bridge for Call to Arms: Gates of Hell and Code:X"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "xfizzle-gh"}]
dependencies = []

[project.optional-dependencies]
earth3 = ["shapely>=2.0", "pytest>=8.0"]

[project.scripts]
gates-of-codex = "gates_of_codex.fast_entrypoint:main"
gates-of-codex-live = "gates_of_codex.acceptance_cli:main"
gates-of-codex-factions = "gates_of_codex.faction_wiring:main"
gates-of-codex-actors = "gates_of_codex.strategic_actor_cli:main"
gates-of-codex-actor-economy = "gates_of_codex.actor_economy_cli:main"
gates-of-codex-expanded = "gates_of_codex.expanded_nations_cli:main"

[project.entry-points.pyinstaller40]
hook-dirs = "gates_of_codex.__pyinstaller:get_hook_dirs"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gates_of_codex = [
    "py.typed",
    "SOURCE_COMMIT",
    "data/*",
    "data/earth3_v1/*.json",
    "pyinstaller_hooks/*.py",
]
